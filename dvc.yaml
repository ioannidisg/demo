stages:
  train:
    cmd: python dvc_demo/train_model.py
    deps:
    - dvc_demo/train.csv
    - dvc_demo/train_model.py
    params:
    - n_estimators
    - random_state
    - test_size
    - split_random_state
    outs:
    - dvc_demo/model.joblib
  evaluate:
    cmd: python dvc_demo/evaluate.py
    deps:
    - dvc_demo/evaluate.py
    - dvc_demo/model.joblib
    - dvc_demo/train.csv
    params:
    - random_state
    metrics:
    - dvc_demo/metrics.json:
        cache: false

