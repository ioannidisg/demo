
name: Python CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r fastapi_demo/requirements-test.txt

      - name: Run tests
        run: python -m pytest -q
