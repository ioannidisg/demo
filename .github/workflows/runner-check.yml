
name: Self-hosted Runner Check

on:
  push:
    branches:
      - feature/fastapi-model-serving
    paths:
      - '.github/workflows/runner-check.yml'

permissions:
  contents: read

jobs:
  check-runner:
    runs-on: [self-hosted, windows, x64, kios-deploy]
    timeout-minutes: 5

    steps:
      - name: Check runner and Docker
        shell: cmd
        run: |
          echo Runner: %RUNNER_NAME%
          echo Operating System: %RUNNER_OS%

          docker version
          docker compose version
          docker ps
