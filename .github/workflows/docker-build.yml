
name: Docker Build CI

on:
  push:
    branches:
      - master
      - 'feature/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'


      # Run tests before building and publishing
      - name: Install test dependencies
        run: python -m pip install -r fastapi_demo/requirements-test.txt

      - name: Run API tests
        run: python -m pytest -q


      # 3. Install ClearML SDK
      - name: Install ClearML
        run: python -m pip install clearml

      # 4. Retrieve model from ClearML
      - name: Fetch model from ClearML
        env:
          CLEARML_API_HOST: https://api.clear.ml
          CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
          CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
        run: python fastapi_demo/fetch_model.py


      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -f fastapi_demo/Dockerfile \
            -t ghcr.io/ioannidisg/kios-fastapi:${{ github.sha }} \
            .

      # 6. Authenticate to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 7. Publish the Docker image
      - name: Push Docker image to GHCR
        run: docker push ghcr.io/ioannidisg/kios-fastapi:${{ github.sha }}
